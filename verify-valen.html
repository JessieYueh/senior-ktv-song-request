let player,ready;const api=new Promise(r=>ready=r);window.onYouTubeIframeAPIReady=()=>ready();const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);
document.getElementById('run').onclick=async()=>{
 document.getElementById('run').disabled=true;await api;
 let fail=null;player=await new Promise(r=>new YT.Player('player',{width:'100%',height:'100%',playerVars:{playsinline:1,origin:location.origin},events:{onReady:e=>r(e.target),onError:e=>fail?.(e.data)}}));player.mute();const results=[];
 for(const entry of entries){document.getElementById('status').textContent='正在檢查：'+entry.title;
 const result=await new Promise(resolve=>{let start=null,finished=false;const done=(ok,reason)=>{if(finished)return;finished=true;clearInterval(poll);clearTimeout(timer);fail=null;resolve({...entry,ok,reason,durationSeconds:Math.round(player.getDuration()||0),videoTitle:player.getVideoData()?.title||''});};const timer=setTimeout(()=>done(false,'播放逾時'),20000);fail=code=>done(false,'YouTube錯誤'+code);
 const poll=setInterval(()=>{const data=player.getVideoData()||{};if(data.video_id!==entry.videoId)return;if(player.getPlayerState()===1){const d=player.getDuration(),t=player.getCurrentTime();if(start===null)start=t;if(t-start>=2){const expected=entry.expectedDurationSeconds;done(d>=expected-60&&d<=expected+120,'已播放且時間前進；片長 '+Math.round(d)+' 秒');}}},500);
 player.loadVideoById(entry.videoId);player.mute();player.playVideo();});
 results.push(result);const li=document.createElement('li');li.textContent=result.title+'：'+(result.ok?'通過':'失敗')+'，'+result.reason+'｜'+result.videoTitle;document.getElementById('results').append(li);document.getElementById('report').textContent=JSON.stringify(results,null,2);player.pauseVideo();
 }
 document.getElementById('status').textContent='完成：'+results.filter(r=>r.ok).length+'／'+results.length+' 通過';player.destroy();
};</script></html>
