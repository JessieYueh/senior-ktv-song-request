<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex"><title>播放器實播驗證</title><style>body{font:20px system-ui;margin:20px}#video{position:relative;width:min(800px,100%);aspect-ratio:16/9;background:#152036}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}button{padding:15px;font-size:20px}pre{white-space:pre-wrap}</style><h1>播放器實播驗證</h1><p>僅驗證公開 YouTube 影片，不存取雲端歌本或使用者資料。</p><button id="start">開始實播</button><button id="next">下一首測試</button><div id="video"></div><p id="status">尚未開始</p><pre id="metrics"></pre><script src="../playback.js?v=4"></script><script>
const ids=['WWxza4XOo4Q','VW0oYTYhefs'];let index=0,ends=0;const events=[];const status=document.getElementById('status'),metrics=document.getElementById('metrics');
function log(s){status.textContent=s;events.push(s);}
const p=new KTVPlayback(document.getElementById('video'),{onPlaying(){log('正在播放 '+ids[index]);},onEnded(){ends++;index=(index+1)%ids.length;p.play(ids[index],'自動接歌');},onBlocked(){log('瀏覽器阻擋自動播放');},onError(e){log(e);}});
document.getElementById('start').onclick=()=>{status.textContent='等待手機點歌模擬…';setTimeout(()=>p.play(ids[index],'可以不是你',{startSeconds:0,endSeconds:8}),1000);};
document.getElementById('next').onclick=()=>{index=(index+1)%ids.length;p.play(ids[index],'下一首');};
setInterval(()=>{let state,time;try{state=p.player?.getPlayerState?.();time=p.player?.getCurrentTime?.();}catch{}const f=document.querySelector('iframe');metrics.textContent=JSON.stringify({ready:p.ready,state,time,ends,iframe:f?{src:f.src,width:f.clientWidth,height:f.clientHeight}:null,events},null,2);},1000);
</script></html>
