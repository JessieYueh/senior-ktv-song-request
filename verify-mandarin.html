<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>張遠國語歌曲驗證</title>
<style>body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f5f7fb;color:#18243b;max-width:900px;margin:auto;padding:20px}section{background:white;border-radius:18px;padding:20px;margin:20px 0;border:1px solid #dce4ed}button,a{font:inherit;font-size:18px}button{padding:12px 18px;border:0;border-radius:10px;background:#1768db;color:white;cursor:pointer}iframe{width:100%;aspect-ratio:16/9;height:auto;border:0}.player{margin-top:15px}.status{font-weight:700;line-height:1.6}.helper{color:#52627a;line-height:1.6}label{display:block;margin-top:10px;font-size:18px}select{font:inherit}textarea{width:100%;box-sizing:border-box;min-height:240px;font:inherit}a{color:#1257b6}</style></head>
<body><h1>張遠 · 國語歌曲驗證</h1>
<p class="helper">測試預設靜音。這批是你指定的國語歌曲版本，尚未加入正式歌本。每首按「測試播放」，確認能在本頁播放、是完整歌曲，以及有沒有歌詞字幕。請勿用「在 YouTube 觀看」的結果代替本頁嵌入測試。</p>
<p><a href="./">回家庭 KTV</a></p><div id="cards"></div>
<h2>回報測試結果</h2><p class="helper">播放器會自動記錄播放成功、長度與錯誤。請另外選擇是否完整、是否有歌詞，然後複製下方結果貼回聊天。這個頁面不會寫入雲端歌本。</p>
<button id="report">整理結果</button><textarea id="result" aria-label="測試結果" readonly></textarea>
<script src="mandarin-candidates.js?v=2"></script><script>
const records=KTV_OST_CANDIDATES.map(s=>({...s,playback:'未測試',duration:0,complete:'未確認',lyrics:'未確認'}));
const players=[];
function renderCards(){records.forEach((s,i)=>{
 const card=document.createElement('section'),heading=document.createElement('h2');heading.textContent=(i+1)+'. '+s.title+' — '+s.artist;
 const info=document.createElement('p');info.className='helper';info.textContent=s.type;
 const status=document.createElement('p');status.className='status';status.id='status-'+i;status.setAttribute('role','status');status.textContent='尚未測試';
 const play=document.createElement('button');play.textContent='▶ 測試播放';play.onclick=()=>playVideo(i);
 const host=document.createElement('div');host.id='host-'+i;host.className='player';card.append(heading,info,play,status,host);
 for(const [key,label,options] of [['complete','歌曲是否完整',['未確認','完整歌曲','片段或非目標歌曲']],['lyrics','歌詞字幕',['未確認','有歌詞字幕','沒有歌詞字幕']]]){
  const field=document.createElement('label');field.textContent=label+'：';const select=document.createElement('select');select.setAttribute('aria-label',s.title+' '+label);
  for(const text of options){const option=document.createElement('option');option.textContent=text;select.append(option);}select.onchange=()=>{s[key]=select.value;};field.append(select);card.append(field);
 }document.getElementById('cards').append(card);
});}
let ready;
const api=new Promise((resolve,reject)=>{ready=resolve;const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>reject(new Error('YouTube 播放器載入失敗'));document.head.append(script);});
window.onYouTubeIframeAPIReady=()=>ready();
async function playVideo(i){
 const s=records[i],status=document.getElementById('status-'+i);status.textContent='載入中…';
 try{await api;players.forEach((p,j)=>{if(j!==i)p?.pauseVideo?.();});if(players[i]){players[i].playVideo();return;}
 players[i]=new YT.Player('host-'+i,{host:'https://www.youtube-nocookie.com',videoId:s.videoId,playerVars:{autoplay:1,mute:1,origin:location.origin,playsinline:1,rel:0},events:{
  onReady:e=>{e.target.mute();e.target.setVolume(5);e.target.playVideo();},
  onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING){s.playback='嵌入播放成功';s.duration=Math.round(e.target.getDuration());const m=Math.floor(s.duration/60),sec=String(s.duration%60).padStart(2,'0');status.textContent=s.playback+' · 長度 '+m+':'+sec+'（請確認完整歌曲與字幕）';}},
  onError:e=>{s.playback='嵌入失敗（錯誤 '+e.data+'）';status.textContent=s.playback;},
  onAutoplayBlocked:()=>{status.textContent='請直接按影片中的播放鍵';}
 }});
 }catch(e){status.textContent=e.message;}
}
document.getElementById('report').onclick=()=>{document.getElementById('result').value=records.map((s,i)=>(i+1)+'. '+s.title+' ['+s.videoId+']：'+s.playback+(s.duration?'；'+Math.floor(s.duration/60)+':'+String(s.duration%60).padStart(2,'0'):'')+'；'+s.complete+'；'+s.lyrics).join('\n');};
renderCards();
</script></body></html>
