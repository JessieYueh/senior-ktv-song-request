<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>快樂點歌｜長輩卡拉 OK</title>
  <style>
    :root{font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#18243b;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3571e9;outline-offset:2px}
    .shell{max-width:1560px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{font-size:clamp(26px,3vw,36px);font-weight:850;letter-spacing:.02em}.brand small{display:block;font-size:16px;color:#68758b;font-weight:500}.pill{background:#e8f1ff;color:#164ca1;padding:10px 18px;border-radius:99px;font-size:18px;font-weight:750}
    .layout{display:grid;grid-template-columns:minmax(380px,1fr) minmax(440px,1.2fr);gap:20px}.panel{background:white;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 8px 30px #1425400a;overflow:hidden}.playerPanel{padding:20px;align-self:start}.eyebrow{color:#66758b;font-size:16px;font-weight:700}.current{font-size:clamp(24px,2.2vw,32px);font-weight:850;margin:8px 0 4px}.sub{color:#65738b;font-size:18px;line-height:1.5}.video{aspect-ratio:16/9;background:#152036;border-radius:18px;overflow:hidden;display:grid;place-items:center;color:white;margin:18px 0}.video iframe{width:100%;height:100%;border:0}.emptyVideo{text-align:center;padding:24px}.emptyVideo strong{display:block;font-size:24px;margin:8px}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:14px;min-height:58px;padding:12px 18px;font-size:20px;font-weight:800;background:#edf2f8;color:#21314b}.btn.primary{background:#1768db;color:white}.btn.green{background:#13834b;color:white}.btn.orange{background:#ea8734;color:#1b2737}.btn.red{background:#fff0ef;color:#ae3028}.btn:disabled{opacity:.45;cursor:not-allowed}.helper{margin-top:14px;font-size:15px;color:#68758b;line-height:1.5}
    .tabs{display:flex;padding:12px;gap:8px;border-bottom:1px solid #e5eaf1}.tab{flex:1;border:0;border-radius:14px;background:transparent;padding:14px;font-size:22px;font-weight:800;color:#64748b}.tab.active{background:#e8f1ff;color:#1257b6}.content{padding:20px}.search{display:flex;gap:10px}.search input{width:100%;min-width:0;border:2px solid #cbd5e1;border-radius:14px;padding:14px 16px;font-size:22px}.filters{display:flex;gap:8px;overflow-x:auto;padding:16px 0}.chip{white-space:nowrap;border:1px solid #cbd5e1;border-radius:99px;padding:10px 18px;background:white;font-size:18px;font-weight:750;color:#32445f}.chip.active{background:#163f7d;color:white;border-color:#163f7d}.list{max-height:calc(100vh - 320px);min-height:380px;overflow:auto}.song{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 3px;border-bottom:1px solid #edf0f4}.songTitle{font-size:23px;font-weight:800}.songMeta{font-size:17px;color:#68758b;margin-top:4px}.songActions{display:flex;gap:8px;flex-shrink:0}.songActions .btn{font-size:18px;min-height:52px;padding:10px 15px}.foot{border-top:1px solid #e5eaf1;padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap}.foot .btn{font-size:18px}.notice{padding:28px;text-align:center;color:#66758b;font-size:19px;line-height:1.6}
    dialog{border:0;border-radius:22px;width:min(650px,calc(100% - 24px));padding:26px;box-shadow:0 24px 80px #12213b55}dialog::backdrop{background:#101b30aa}dialog h2{margin:0 0 10px;font-size:27px}dialog p{color:#64748b;line-height:1.5}dialog label{display:block;font-weight:750;margin-top:14px}dialog input,dialog textarea,dialog select{width:100%;border:2px solid #cbd5e1;border-radius:12px;padding:12px;margin-top:6px;font-size:19px}dialog textarea{height:170px}dialog menu{display:flex;gap:10px;justify-content:flex-end;padding:0;margin:22px 0 0;flex-wrap:wrap}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#152b4c;color:white;padding:13px 22px;border-radius:14px;font-size:19px;font-weight:750;z-index:10;max-width:90vw;text-align:center}
    [hidden],.adminOnly{display:none!important}.manageOpen .adminOnly{display:inline-flex!important}@media(max-width:950px){.layout{grid-template-columns:1fr}.list{max-height:none;min-height:220px}.playerPanel{order:2}.catalogPanel{order:1}}@media(max-width:600px){.shell{padding:10px}.top{padding:8px}.pill{font-size:15px}.panel{border-radius:18px}.content,.playerPanel{padding:14px}.song{align-items:stretch;flex-direction:column}.songActions .btn{flex:1}.tabs{padding:8px}.tab{font-size:19px}.controls .btn{font-size:18px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand">🎤 快樂點歌<small>找歌、點歌、開唱，三步就好</small></div><div class="pill" id="queueBadge">待唱 0 首</div></header>
  <div class="layout">
    <section class="panel playerPanel" aria-label="播放區">
      <div class="eyebrow">現在播放</div><div class="current" id="currentTitle">尚未點歌</div><div class="sub" id="currentArtist">從右邊選一首喜歡的歌</div>
      <div class="video" id="video"><div class="emptyVideo">🎵<strong>準備開唱</strong>點選歌本中的「點歌」</div></div>
      <div class="controls"><button class="btn primary" id="playBtn">▶ 播放／暫停</button><button class="btn" id="replayBtn">↺ 重唱</button><button class="btn" id="modeBtn">🎙 切換原唱</button><button class="btn orange" id="nextBtn">⏭ 下一首</button></div>
      <div id="videoHelp" class="helper">歌曲影片由 YouTube 提供；部分影片可能不允許在此播放。<button class="btn" id="openYouTubeBtn" hidden>↗ 在 YouTube 開啟這首</button></div>
    </section>
    <section class="panel catalogPanel" aria-label="點歌區">
      <nav class="tabs" aria-label="歌單頁籤"><button class="tab active" id="catalogTab" aria-selected="true">📖 點歌本</button><button class="tab" id="queueTab" aria-selected="false">🎵 已點歌曲 <span id="queueCount">0</span></button></nav>
      <div id="catalogPane"><div class="content"><div class="search"><input id="search" type="search" placeholder="搜尋歌名或歌手" aria-label="搜尋歌名或歌手"><button class="btn" id="clearBtn">清除</button></div><div class="filters" id="filters" aria-label="語言分類"></div><div class="list" id="songList"></div></div><div class="foot"><button class="btn" id="manageBtn" aria-expanded="false">⚙ 管理歌本</button><button class="btn adminOnly" id="addBtn">＋ 新增歌曲</button><button class="btn adminOnly" id="batchBtn">📋 批次加入歌單</button></div></div>
      <div id="queuePane" hidden><div class="content"><div class="list" id="queueList"></div></div></div>
    </section>
  </div>
</main>
<dialog id="songDialog"><form method="dialog" id="songForm"><h2 id="songDialogTitle">新增歌曲</h2><p>貼上可播放的 YouTube 影片網址；也可以先留空，之後再補。</p><label>歌名<input id="titleInput" required maxlength="100"></label><label>歌手<input id="artistInput" required maxlength="100"></label><label>語言<select id="langInput"><option>台語</option><option>國語</option><option>其他</option></select></label><label>伴奏影片網址<input id="videoInput" type="text" placeholder="YouTube 網址或 11 碼 ID"></label><label>原唱影片網址（選填）<input id="vocalInput" type="text" placeholder="YouTube 網址或 11 碼 ID"></label><menu><button type="button" class="btn" id="cancelSong">取消</button><button type="submit" class="btn primary">儲存</button></menu></form></dialog>
<dialog id="batchDialog"><h2>批次加入歌曲</h2><p>每行一首，依序填「歌名、歌手、語言、伴奏網址、原唱網址」，用 Tab 分隔。後兩欄可以留空。</p><textarea id="batchText" placeholder="月亮代表我的心&#9;鄧麗君&#9;國語&#9;https://youtu.be/影片ID"></textarea><menu><button class="btn" id="cancelBatch">取消</button><button class="btn primary" id="saveBatch">加入歌本</button></menu></dialog>
<dialog id="nextDialog"><h2>要播放下一首嗎？</h2><p id="nextMessage"></p><menu><button class="btn" id="cancelNext">繼續唱</button><button class="btn orange" id="confirmNext">確定切歌</button></menu></dialog>
<div id="toast" role="status" hidden></div>
<script src="songs.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const KEY = 'happy_ktv_custom_songs_v1';
  let custom = []; try { custom = JSON.parse(localStorage.getItem(KEY) || '[]'); if (!Array.isArray(custom)) custom=[]; } catch { custom=[]; }
  const songKey = s => s.title+'|'+s.artist;
  const defaults = window.KTV_SONGS || [];
  custom.forEach(c=>{const original=defaults.find(s=>songKey(s)===songKey(c));if(original&&!c.videoId)c.videoId=original.videoId;});
  const catalog = [...defaults.filter(s=>!custom.some(c=>songKey(c)===songKey(s))), ...custom];
  let queue=[], current=null, category='全部', vocal=false, player=null, editor=null, paused=false;
  const validId = value => { const s=(value||'').trim(); if (/^[\w-]{11}$/.test(s)) return s; try { const u=new URL(s); if (u.hostname==='youtu.be') return /^[\w-]{11}$/.test(u.pathname.slice(1))?u.pathname.slice(1):''; if (['youtube.com','www.youtube.com','m.youtube.com','www.youtube-nocookie.com'].includes(u.hostname)) { const id=u.searchParams.get('v') || u.pathname.match(/\/(?:embed|shorts|live)\/([\w-]{11})/)?.[1]; return /^[\w-]{11}$/.test(id||'')?id:''; } } catch {} return ''; };
  function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3000);}
  function saveCustom(){localStorage.setItem(KEY,JSON.stringify(custom));}
  function button(text,cls,action){const b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.addEventListener('click',action);return b;}
  function switchTab(which){const c=which==='catalog';$('catalogPane').hidden=!c;$('queuePane').hidden=c;$('catalogTab').classList.toggle('active',c);$('queueTab').classList.toggle('active',!c);$('catalogTab').setAttribute('aria-selected',c);$('queueTab').setAttribute('aria-selected',!c);}
  function renderFilters(){const el=$('filters');el.replaceChildren();['全部','台語','國語','其他'].forEach(name=>{const b=document.createElement('button');b.className='chip'+(category===name?' active':'');b.textContent=name;b.addEventListener('click',()=>{category=name;renderFilters();renderCatalog();});el.append(b);});}
  function row(song,actions){const el=document.createElement('div');el.className='song';const info=document.createElement('div');const title=document.createElement('div');title.className='songTitle';title.textContent=song.title;const meta=document.createElement('div');meta.className='songMeta';meta.textContent=(song.artist||'未知歌手')+' · '+(song.lang||'其他');info.append(title,meta);const buttons=document.createElement('div');buttons.className='songActions';actions.forEach(a=>buttons.append(button(...a)));el.append(info,buttons);return el;}
  function renderCatalog(){const q=$('search').value.trim().toLocaleLowerCase();const songs=catalog.filter(s=>(category==='全部'||(s.lang||'其他')===category)&&(!q||(s.title+' '+s.artist).toLocaleLowerCase().includes(q)));$('songList').replaceChildren();if(!songs.length){const n=document.createElement('div');n.className='notice';n.textContent='找不到歌曲。請試試其他關鍵字。';$('songList').append(n);}songs.forEach(song=>$('songList').append(row(song,[['＋ 點歌','green',()=>addSong(song)],['⋯','adminOnly',()=>openEditor(song)]])));}
  function renderQueue(){ $('queueCount').textContent=queue.length;$('queueBadge').textContent='待唱 '+queue.length+' 首';$('queueList').replaceChildren();if(!queue.length){const n=document.createElement('div');n.className='notice';n.textContent='還沒有待唱歌曲。回到點歌本，按「＋ 點歌」。';$('queueList').append(n);}queue.forEach((song,i)=>$('queueList').append(row({...song,title:(i+1)+'. '+song.title},[['優先','',()=>{queue.splice(i,1);queue.unshift(song);renderQueue();toast('已排到下一首');}],['移除','red',()=>{queue.splice(i,1);renderQueue();toast('已移除歌曲');}]])));}
  function searchVideo(song){window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(song.title+' '+song.artist+' KTV 伴奏'),'_blank','noopener');}
  function showVideo(){const id=validId(vocal?(current?.vocalId||current?.videoId):current?.videoId);const container=$('video');container.replaceChildren();player=null;paused=false;$('openYouTubeBtn').hidden=!id;if(!current)return;if(!id){const box=document.createElement('div');box.className='emptyVideo';box.innerHTML='<strong>這首歌還沒有設定影片</strong><span>可以搜尋伴奏，找到後貼回歌本</span><br><br>';box.append(button('🔎 搜尋伴奏','primary',()=>searchVideo(current)),' ',button('貼上影片網址','',()=>openEditor(current)));container.append(box);return;}const iframe=document.createElement('iframe');iframe.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&enablejsapi=1&playsinline=1&origin='+encodeURIComponent(location.origin);iframe.title=current.title+' YouTube 播放器';iframe.allow='autoplay; encrypted-media; picture-in-picture';iframe.allowFullscreen=true;container.append(iframe);player=iframe;}
  function start(song){current=song;vocal=false;$('currentTitle').textContent=song.title;$('currentArtist').textContent=song.artist;$('modeBtn').textContent='🎙 切換原唱';showVideo();toast('現在播放：'+song.title);}
  function addSong(song){if(!current)start(song);else {queue.push(song);renderQueue();toast('已加入待唱：'+song.title);}}
  function next(){if(queue.length)start(queue.shift());else{current=null;$('currentTitle').textContent='尚未點歌';$('currentArtist').textContent='待唱歌曲已唱完';$('video').innerHTML='<div class="emptyVideo"><strong>唱完囉！</strong>再點一首喜歡的歌</div>';player=null;toast('待唱歌曲已唱完');}renderQueue();}
  function sendPlayer(command){player?.contentWindow?.postMessage(JSON.stringify({event:'command',func:command,args:[]}), 'https://www.youtube-nocookie.com');}
  function openEditor(song=null){editor=song;$('songDialogTitle').textContent=song?'編輯歌曲':'新增歌曲';$('titleInput').value=song?.title||'';$('artistInput').value=song?.artist||'';$('langInput').value=song?.lang||'台語';$('videoInput').value=song?.videoId||'';$('vocalInput').value=song?.vocalId||'';$('songDialog').showModal();}
  $('songForm').addEventListener('submit',e=>{e.preventDefault();const video=$('videoInput').value.trim(),voice=$('vocalInput').value.trim();if((video&&!validId(video))||(voice&&!validId(voice))){toast('請確認 YouTube 網址或影片 ID');return;}const item={title:$('titleInput').value.trim(),artist:$('artistInput').value.trim(),lang:$('langInput').value,videoId:validId(video),vocalId:validId(voice)};if(!item.title||!item.artist)return;if(editor){Object.assign(editor,item);if(!custom.includes(editor))custom.push(editor);}else{custom.push(item);catalog.push(item);}saveCustom();renderCatalog();renderQueue();if(current===editor)showVideo();$('songDialog').close();toast(editor?'歌曲已更新':'歌曲已加入歌本');});
  $('saveBatch').addEventListener('click',()=>{let count=0,invalid=0;$('batchText').value.split(/\r?\n/).forEach(line=>{if(!line.trim())return;const [title,artist,lang,video,vocal]=line.split('\t').map(v=>v?.trim()||'');if(!title||!artist||(video&&!validId(video))||(vocal&&!validId(vocal))){invalid++;return;}const s={title,artist,lang:lang||'其他',videoId:validId(video),vocalId:validId(vocal)};custom.push(s);catalog.push(s);count++;});saveCustom();renderCatalog();$('batchDialog').close();$('batchText').value='';toast('加入 '+count+' 首'+(invalid?'，'+invalid+' 行格式有誤':''));});
  $('catalogTab').onclick=()=>switchTab('catalog');$('queueTab').onclick=()=>switchTab('queue');$('search').oninput=renderCatalog;$('clearBtn').onclick=()=>{$('search').value='';renderCatalog();$('search').focus();};$('manageBtn').onclick=()=>{const open=document.body.classList.toggle('manageOpen');$('manageBtn').setAttribute('aria-expanded',open);};$('addBtn').onclick=()=>openEditor();$('batchBtn').onclick=()=>$('batchDialog').showModal();$('cancelSong').onclick=()=>$('songDialog').close();$('cancelBatch').onclick=()=>$('batchDialog').close();$('openYouTubeBtn').onclick=()=>{const id=validId(vocal?(current?.vocalId||current?.videoId):current?.videoId);if(id)window.open('https://www.youtube.com/watch?v='+id,'_blank','noopener');};
  $('playBtn').onclick=()=>{if(!current){toast('請先點歌');return;}if(!player){showVideo();return;}paused=!paused;sendPlayer(paused?'pauseVideo':'playVideo');toast(paused?'已暫停':'繼續播放');};$('replayBtn').onclick=()=>{if(!current)return toast('請先點歌');showVideo();toast('重新播放 '+current.title);};$('modeBtn').onclick=()=>{if(!current)return toast('請先點歌');if(!current.vocalId)return toast('這首歌尚未設定原唱影片');vocal=!vocal;$('modeBtn').textContent=vocal?'🎵 切回伴奏':'🎙 切換原唱';showVideo();};$('nextBtn').onclick=()=>{if(!current&&!queue.length)return toast('請先點歌');$('nextMessage').textContent=queue.length?'下一首：'+queue[0].title:'目前沒有下一首，切歌後會停止播放。';$('nextDialog').showModal();};$('cancelNext').onclick=()=>$('nextDialog').close();$('confirmNext').onclick=()=>{$('nextDialog').close();next();};
  renderFilters();renderCatalog();renderQueue();
</script>
</body>
</html>
