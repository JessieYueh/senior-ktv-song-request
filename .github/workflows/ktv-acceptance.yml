name: KTV PR automatic acceptance
on:
  pull_request:
    paths:
      - 'index.html'
      - 'cloud.js'
      - 'firestore.rules'
      - 'tests/**'
      - '.github/workflows/ktv-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    name: JS syntax and eight-feature contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/feature-contract.test.mjs
  firestore:
    name: Firestore emulator authorization checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save --package-lock=false firebase-tools@14 @firebase/rules-unit-testing@4 firebase@11
      - name: Test local rules only, never deploy
        run: npx firebase emulators:exec --project demo-ktv-ci --only firestore "node --test tests/firestore.rules.test.mjs"
